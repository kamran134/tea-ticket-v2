# Local development — builds from source
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teaticket}
      POSTGRES_USER: ${POSTGRES_USER:-teaticket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teaticket}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-teaticket}:${POSTGRES_PASSWORD:-secret}@db:5432/${POSTGRES_DB:-teaticket}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      CORS_ORIGIN: http://localhost:5173
      PORT: 3000
      # kapital points at Kapital Bank's public TXPG sandbox by default, so this stack
      # works out of the box with no extra setup — those are the bank's own published
      # test credentials (pg.kapitalbank.az/docs), not a secret. Override for prod.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-kapital}
      # BOOKING_TTL_SECONDS / PAYMENT_TTL_SECONDS supersede PAYMENT_HOLD_*, which
      # services/ttl.ts still honours as a fallback. Both kept so existing .env files work.
      PAYMENT_HOLD_MINUTES: ${PAYMENT_HOLD_MINUTES:-15}
      PAYMENT_HOLD_SECONDS: ${PAYMENT_HOLD_SECONDS:-10}
      BOOKING_TTL_SECONDS: ${BOOKING_TTL_SECONDS:-900}
      PAYMENT_TTL_SECONDS: ${PAYMENT_TTL_SECONDS:-900}
      # Guards /api/test (seed + reset, which wipe data). Never true outside local QA.
      TEST_MODE: ${TEST_MODE:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3001}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
      PAYMENT_WEBHOOK_BASE_URL: ${PAYMENT_WEBHOOK_BASE_URL:-http://backend:3000}
      MOCK_WEBHOOK_SECRET: ${MOCK_WEBHOOK_SECRET:-dev-mock-webhook-secret}
      KAPITAL_API_BASE_URL: ${KAPITAL_API_BASE_URL:-https://txpgtst.kapitalbank.az/api}
      KAPITAL_USERNAME: ${KAPITAL_USERNAME:-TerminalSys/kapital}
      KAPITAL_PASSWORD: ${KAPITAL_PASSWORD:-kapital123}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      RESEND_RECEIVING_WEBHOOK_SECRET: ${RESEND_RECEIVING_WEBHOOK_SECRET:-}
      EMAIL_FROM: ${EMAIL_FROM:-TeaTicket <no-reply@tea-ticket.com>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-support@tea-ticket.com}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
