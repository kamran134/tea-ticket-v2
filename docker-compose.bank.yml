# Overlay adding the BirManatBank simulator to the core stack.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.bank.yml up -d
#
# Or, to keep the plain `docker compose ...` commands working, add to .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.bank.yml
#
# The backend must also be pointed at the bank via .env:
#   PAYMENT_PROVIDER=bank
#   BANK_API_KEY / BANK_WEBHOOK_SECRET (same values as the BIRMANAT_BANK_* pair below)

services:
  backend:
    depends_on:
      birmanat-bank:
        condition: service_healthy

  birmanat-bank:
    build:
      context: ./apps/birmanat-bank
      dockerfile: Dockerfile
    image: ${BIRMANAT_BANK_IMAGE:-tea-ticket-birmanat-bank:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BIRMANAT_BANK_PORT:-8082}:80"
    environment:
      BIRMANAT_BANK_PUBLIC_URL: ${BIRMANAT_BANK_PUBLIC_URL:-https://tickets.birmanat.band/bank}
      BIRMANAT_BANK_API_TOKEN: ${BIRMANAT_BANK_API_TOKEN}
      BIRMANAT_BANK_WEBHOOK_SECRET: ${BIRMANAT_BANK_WEBHOOK_SECRET}
      BIRMANAT_BANK_ALLOWED_HOSTS: ${BIRMANAT_BANK_ALLOWED_HOSTS:-tickets.birmanat.band,backend}
      BIRMANAT_BANK_SQLITE_PATH: /var/www/html/var/bank.sqlite
    volumes:
      - birmanat_bank_data:/var/www/html/var
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  birmanat_bank_data:
