name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  check:
    name: Typecheck, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend deps
        run: npm install
        working-directory: apps/backend

      - name: Install frontend deps
        run: npm install
        working-directory: apps/frontend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/backend

      - name: Backend typecheck
        run: npx tsc --noEmit
        working-directory: apps/backend

      - name: Backend lint
        run: npm run lint
        working-directory: apps/backend

      - name: Backend tests
        run: npm run test
        working-directory: apps/backend

      - name: Frontend typecheck
        run: npx tsc --noEmit
        working-directory: apps/frontend

      - name: Frontend lint
        run: npm run lint
        working-directory: apps/frontend

      - name: Frontend tests
        run: npm run test
        working-directory: apps/frontend

  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=master-

      - uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=master-

      - uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.yml,infra/nginx/tea-ticket.com.conf"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export GITHUB_REPOSITORY='${{ github.repository }}'
            export POSTGRES_DB='${{ secrets.POSTGRES_DB }}'
            export POSTGRES_USER='${{ secrets.POSTGRES_USER }}'
            export POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}'
            export JWT_SECRET='${{ secrets.JWT_SECRET }}'
            export ADMIN_PASSWORD_HASH='${{ secrets.ADMIN_PASSWORD_HASH }}'
            export CORS_ORIGIN='https://tea-ticket.com'

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -af

            sudo cp infra/nginx/tea-ticket.com.conf /etc/nginx/sites-available/tea-ticket.com
            sudo ln -sf /etc/nginx/sites-available/tea-ticket.com /etc/nginx/sites-enabled/tea-ticket.com
            sudo nginx -t && sudo systemctl reload nginx

            docker compose ps

