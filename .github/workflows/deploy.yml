name: Build and Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=dev-

      - uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=dev-

      - uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.yml,infra/nginx/tea-ticket.com.conf"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export GITHUB_REPOSITORY='${{ github.repository }}'
            export POSTGRES_DB='${{ secrets.POSTGRES_DB }}'
            export POSTGRES_USER='${{ secrets.POSTGRES_USER }}'
            export POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}'
            export JWT_SECRET='${{ secrets.JWT_SECRET }}'
            export ADMIN_EMAIL='${{ secrets.ADMIN_EMAIL }}'
            export ADMIN_PASSWORD_HASH='${{ secrets.ADMIN_PASSWORD_HASH }}'
            export CORS_ORIGIN='https://tea-ticket.com'
            export MOCK_WEBHOOK_SECRET='${{ secrets.MOCK_WEBHOOK_SECRET }}'

            # tea-ticket.com is the sandbox environment (see .claude/plan-branching.md),
            # so it points at the Kapital Bank TEST gateway. The values below are the
            # published sandbox credentials from pg.kapitalbank.az/docs, not secrets.
            #
            # Test contour only: real cards do not work here and no money moves. A real
            # production deployment must switch KAPITAL_API_BASE_URL to
            # https://e-commerce.kapitalbank.az/api and supply merchant credentials
            # issued under an acquiring contract, moved into GitHub Secrets.
            export PAYMENT_PROVIDER='kapital'
            export KAPITAL_API_BASE_URL='https://txpgtst.kapitalbank.az/api'
            export KAPITAL_USERNAME='TerminalSys/kapital'
            export KAPITAL_PASSWORD='kapital123'

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -af

            sudo cp infra/nginx/tea-ticket.com.conf /etc/nginx/sites-available/tea-ticket.com
            sudo ln -sf /etc/nginx/sites-available/tea-ticket.com /etc/nginx/sites-enabled/tea-ticket.com
            sudo nginx -t && sudo systemctl reload nginx

            docker compose ps

            # One-off Super Admin password reset; revert after this deploy.
            set -o pipefail
            echo '' \
              | base64 -d \
              | docker compose exec -T -i backend node -

