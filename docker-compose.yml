# Core stack: db + backend + frontend.
#
# Defaults target tea-ticket.com, which is deployed by CI without an .env file —
# every value below must therefore work as-is when only the CI-exported variables
# are present. Any deployment with its own .env (see .env.example) overrides them.

services:
  db:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-kamran134/tea-ticket-v2}/backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      CORS_ORIGIN: ${CORS_ORIGIN}
      UPLOADS_DIR: /app/uploads
      PORT: 3000
      # mock — self-contained hosted page, no external calls; kapital — Kapital Bank TXPG
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_HOLD_MINUTES: ${PAYMENT_HOLD_MINUTES:-15}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://tea-ticket.com}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-https://tea-ticket.com}
      PAYMENT_WEBHOOK_BASE_URL: ${PAYMENT_WEBHOOK_BASE_URL:-http://backend:3000}
      MOCK_WEBHOOK_SECRET: ${MOCK_WEBHOOK_SECRET:-dev-mock-webhook-secret}
      KAPITAL_API_BASE_URL: ${KAPITAL_API_BASE_URL:-}
      KAPITAL_USERNAME: ${KAPITAL_USERNAME:-}
      KAPITAL_PASSWORD: ${KAPITAL_PASSWORD:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      RESEND_RECEIVING_WEBHOOK_SECRET: ${RESEND_RECEIVING_WEBHOOK_SECRET:-}
      EMAIL_FROM: ${EMAIL_FROM:-TeaTicket <tickets@tea-ticket.com>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-support@tea-ticket.com}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ${UPLOADS_PATH:-/opt/tea-ticket-v2/uploads}:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-kamran134/tea-ticket-v2}/frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
