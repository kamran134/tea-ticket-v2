<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StolitsArt Ticket — Управление</title>
    <script>
      // Runs before React so a first visit never flashes the light theme.
      // Mirrors readStoredTheme(): an explicit light choice wins, otherwise dark.
      try {
        var stored = localStorage.getItem('tea-ticket-theme');
        if (stored !== 'light') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/manage.tsx"></script>
  </body>
</html>
