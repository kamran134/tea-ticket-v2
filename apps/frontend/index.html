    <script>
      // Runs before React so a first visit never flashes the light theme.
      // Mirrors readStoredTheme(): an explicit light choice wins, otherwise dark.
      try {
        var stored = localStorage.getItem('tea-ticket-theme');
        if (stored !== 'light') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>
