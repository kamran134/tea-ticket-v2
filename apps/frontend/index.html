<!DOCTYPE html>
<html lang='<!--# echo var="page_lang" default="ru" -->'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Page title, meta, canonical, Open Graph and JSON-LD come from the backend via
         nginx SSI (nginx.conf, backend routes/seo.ts). The Vite dev server leaves these
         comments inert; the React app sets document.title itself. -->
    <!--# config errmsg="" -->
    <!--# include virtual="/__seo/head$request_uri" -->
    <script>
      // Runs before React so a first visit never flashes the light theme.
      // Mirrors readStoredTheme(): an explicit light choice wins, otherwise dark.
      try {
        var stored = localStorage.getItem('tea-ticket-theme');
        if (stored !== 'light') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--# include virtual="/__seo/body$request_uri" --></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
