<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tea Ticket — Мой билет</title>
    <script>
      // Runs before React so a dark viewer never sees a flash of the light theme.
      // Mirrors readStoredTheme(): an explicit choice wins, otherwise follow the OS.
      try {
        var stored = localStorage.getItem('tea-ticket-theme');
        var dark = stored === 'dark'
          || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ticket.tsx"></script>
  </body>
</html>
