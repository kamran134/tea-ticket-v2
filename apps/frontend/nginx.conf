server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — required when proxy_pass uses a variable hostname.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 2s;
    set $backend_upstream backend:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # The public SPA shell. SSI pulls the page's <head> tags and readable content from the
    # backend (see index.html and backend routes/seo.ts), so browsers, search engines and
    # AI crawlers that do not run JavaScript all get the same real HTML.
    location = /index.html {
        ssi on;
        add_header Cache-Control "no-cache";
    }

    # SSI subrequests only. A slow or down backend must not hold the page: short timeouts,
    # and index.html sets an empty errmsg so the shell still renders without the fragment.
    # No proxy_set_header here: any one would drop the server-level Host/X-Forwarded-*
    # headers, and the backend builds canonical URLs from Host.
    location ^~ /__seo/ {
        internal;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_pass_request_body off;
        # Without this an error page (e.g. 502 "Bad Gateway" HTML) would be inlined into the page.
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @seo_fragment_unavailable;
        rewrite ^/__seo/(.*)$ /api/seo/$1 break;
        proxy_pass http://$backend_upstream;
    }

    location @seo_fragment_unavailable {
        return 204;
    }

    location = /sitemap.xml {
        proxy_pass http://$backend_upstream/api/seo/sitemap.xml;
    }

    # Ticket links are private. The meta robots tag covers the HTML; this header
    # covers the response even when a crawler does not read the document.
    location = /ticket {
        try_files /ticket.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Admin and door-scanner shells are never search results.
    location ~ ^/(manage|admin)(\.html)?$ {
        try_files /$1.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Event pages (/e/:slug) and legal documents share the public shell. An internal
    # redirect (not try_files, which would serve the file here) lands in the SSI location.
    location /e/ {
        rewrite ^ /index.html last;
    }

    location ~ ^/(privacy-policy|terms|refund-policy|about)/?$ {
        rewrite ^ /index.html last;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
