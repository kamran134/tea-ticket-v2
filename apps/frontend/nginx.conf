server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Event pages (/e/:slug) — SPA for browsers; OG HTML from backend for link-preview fetchers
    location /e/ {
        if ($is_link_preview_crawler = 1) {
            proxy_pass http://backend:3000$request_uri;
            break;
        }
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Legal documents share the main bundle (language is client-side i18n)
    location ~ ^/(privacy-policy|terms|refund-policy|about)/?$ {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
